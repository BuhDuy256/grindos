site_name: GrindOS
site_description: Gamified productivity system — architecture and design documentation
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
    - architecture/index.md
    - Web: architecture/web-architecture.md
    - AI Backend: architecture/ai-architecture.md
    - Database: architecture/database.md
    - AI Core:
      - Overview: architecture/ai-core/01_architecture_overview.md
      - Database Schema: architecture/ai-core/02_database_schema.md
      - Prompt Contract: architecture/ai-core/03_prompt_service_contract.md
      - Batch Logic: architecture/ai-core/04_batch_execution_logic.md
      - API Endpoints: architecture/ai-core/05_api_endpoints_contract.md
  - Design:
    - Figma: design/figma-design.md
